---
- name: Base setup for all servers.
  hosts: all
  become: true

  tasks:
    # User Access
    - name: Make sure andrewm is in sudo group.
      ansible.builtin.user:
        name: andrewm
        groups: sudo
        append: true

    - name: Give andrewm sudo without password.
      ansible.builtin.copy:
        dest: /etc/sudoers.d/andrewm
        content: "andrewm ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Disable ssh password, root login, and interactive login.
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart_ssh

    # Package updates
    - name: Update and Upgrade apt packages.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist

    - name: Install unattended upgrades packages.
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Copy unattended-upgrades config file in place.
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"


    # Install base tools
    - name: Install base tools.
      ansible.builtin.apt:
        name: [curl, vim, htop, git, rsync, tmux, ncdu, parted]
        state: present


    # Time
    - name: Install Chrony for time synchronization.
      ansible.builtin.apt:
        name: chrony
        state: present

    - name: Ensure Chrony is running.
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: Change timezone and hardware clock to UTC.
      community.general.timezone:
        name: UTC
        hwclock: UTC

    # Tailscale
    - name: Download Tailscale's package signing key.
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add Tailscale package repository.
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        uris: https://pkgs.tailscale.com/stable/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg

    - name: Install Tailscale.
      ansible.builtin.apt:
        name: tailscale
        update_cache: true

    - name: Ensure Tailscale service is running and enable it at boot.
      ansible.builtin.service:
        name: tailscaled
        state: started
        enabled: true

    - name: Check to see if this server is already on tailnet.
      ansible.builtin.command: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Join tailnet if not already joined.
      ansible.builtin.command: tailscale up --authkey={{ tailscale_authkey }} --hostname={{ inventory_hostname }}
      when: (tailscale_status.stdout | from_json).BackendState != 'Running'
      changed_when: true
      no_log: true

    - name: Check current Tailscale preferences.
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_prefs
      changed_when: false

    - name: Enable Tailscale auto-updates if not already set.
      ansible.builtin.command: tailscale set --auto-update
      when: not (tailscale_prefs.stdout | from_json).AutoUpdate.Apply
      changed_when: true

  handlers:
    - name: Restart_ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
