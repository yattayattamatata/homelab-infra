---
- name: Base setup for all servers.
  hosts: all
  become: true

  tasks:
  # User Access
    - name: Make sure andrewm is in sudo group.
      ansible.builtin.user:
        name: andrewm
        groups: sudo
        append: true

    - name: Give andrewm sudo without password.
      ansible.builtin.copy:
        dest: /etc/sudoers.d/andrewm
        content: "andrewm ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

  # Time
    - name: Install Chrony for time synchronization.
      ansible.builtin.package:
        name: chrony
        state: present

    - name: Ensure Chrony is running.
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: Change timezone and hardware clock to UTC.
      community.general.timezone:
        name: UTC
        hwclock: UTC

  #
