---
- name: Base setup for all servers.
  hosts: all
  become: true

  tasks:
    # User Access
    - name: Make sure andrewm is in sudo group.
      ansible.builtin.user:
        name: andrewm
        groups: sudo
        append: true

    - name: Give andrewm sudo without password.
      ansible.builtin.copy:
        dest: /etc/sudoers.d/andrewm
        content: "andrewm ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Disable ssh password, root login, and interactive login.
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart_ssh

    # Package updates
    - name: Update and Upgrade apt packages.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist

    - name: Install unattended upgrades packages.
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Copy unattended-upgrades config file in place.
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"


    # Install base tools
    - name: Install base tools.
      ansible.builtin.apt:
        name: [curl, vim, htop, git, rsync, tmux, ncdu]
        state: present


    # Time
    - name: Install Chrony for time synchronization.
      ansible.builtin.apt:
        name: chrony
        state: present

    - name: Ensure Chrony is running.
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: Change timezone and hardware clock to UTC.
      community.general.timezone:
        name: UTC
        hwclock: UTC


  handlers:
    - name: Restart_ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
