---

- name: Sync media from Unraid to travel server.
  hosts: travel_servers
  gather_facts: false
  become: false

  tasks:
    - name: Check titles exist on Unraid (typo protection).
      ansible.builtin.raw: test -d {{ ('/mnt/user/data/media/' ~ item) | quote }}
      loop: "{{ media_sync }}"
      delegate_to: zeus
      changed_when: false
      check_mode: false

    - name: Measure selected media size on Unraid.
      ansible.builtin.raw: >-
        du -scb {% for title in media_sync %}{{ ('/mnt/user/data/media/' ~ title) | quote }} {% endfor %}
        | tail -1 | cut -f1
      delegate_to: zeus
      register: media_size
      changed_when: false
      check_mode: false
      when: media_sync | length > 0

    - name: Measure space on travel server.
      ansible.builtin.shell: |
        set -o pipefail
        df --output=avail -B1 {{ data_root }} | tail -1
        du -sb {{ data_root }}/media | cut -f1
      args:
        executable: /bin/bash
      register: travel_space
      changed_when: false
      check_mode: false

    - name: Check selection fits on travel server.
      ansible.builtin.assert:
        that: needed | int <= (room | int * 0.95)
        fail_msg: "Selection needs {{ needed_gb }} GB, only {{ room_gb }} GB available for media."
        success_msg: "Selection {{ needed_gb }} GB of {{ room_gb }} GB; {{ free_gb }} GB free after sync."
      vars:
        needed: "{{ media_size.stdout | trim }}"
        room: "{{ travel_space.stdout_lines[0] | int + travel_space.stdout_lines[1] | int }}"
        needed_gb: "{{ (needed | int / 1e9) | round(1) }}"
        room_gb: "{{ (room | int / 1e9) | round(1) }}"
        free_gb: "{{ ((room | int - needed | int) / 1e9) | round(1) }}"
      when: media_sync | length > 0

    - name: Build rsync filter rules from the title list.
      ansible.builtin.set_fact:
        media_filters: "{{ parent_includes + title_includes + season_excludes }}"
      vars:
        season_entries: "{{ media_sync | select('search', '^[^/]+/[^/]+/[^/]+$') | list }}"
        season_parents: "{{ season_entries | map('dirname') | unique | list }}"
        parent_includes: "{{ season_parents | map('regex_escape') | map('regex_replace', '^(.*)$', '+ /\\1/') | list }}"
        title_includes: "{{ media_sync | map('regex_escape') | map('regex_replace', '^(.*)$', '+ /\\1/***') | list }}"
        season_excludes: "{{ season_parents | map('regex_escape') | map('regex_replace', '^(.*)$', '- /\\1/*/') | list }}"

    - name: Sync media to travel server.
      ansible.builtin.raw: >-
        rsync -a --omit-dir-times --no-owner --no-group --chmod=D755,F644
        --itemize-changes --delete --delete-excluded
        {% for rule in media_filters %}--filter={{ rule | quote }} {% endfor %}
        --filter='+ /*/' --filter='- /*/*' --filter='- /*'
        {{ '--dry-run' if ansible_check_mode else '' }}
        /mnt/user/data/media/
        andrewm@{{ media_sync_host }}:{{ data_root }}/media/
      delegate_to: zeus
      check_mode: false
      register: media_rsync
      changed_when: media_rsync.stdout | trim | length > 0

    - name: List changes.
      ansible.builtin.debug:
        var: media_rsync.stdout_lines
