---
- name: Travel server configuration.
  hosts: travel_servers
  become: true

  tasks:
    # Configure storage, create filesystems and mount.
    - name: Create logical volumes on 2tb ssd.
      community.general.lvol:
        vg: "{{ item.vg }}"
        lv: "{{ item.lv }}"
        size: "{{ item.size }}"
      loop:
        - { vg: "{{ volume_group }}", lv: appdata, size: "{{ appdata_size }}" }
        - { vg: "{{ volume_group }}", lv: storage, size: "{{ storage_size }}" }

    - name: Create partition on 4tb nvme.
      community.general.parted:
        device: "{{ media_path }}"
        number: 1
        state: present
        label: gpt

    - name: Create filesystems on lvms and partitions.
      community.general.filesystem:
        dev: "{{ item.dev }}"
        fstype: ext4
        opts: "-L {{ item.label }} {{ item.reserve }}"
      loop:
        - { dev: "{{ media_part }}", label: data, reserve: "-m 0" }
        - { dev: "/dev/{{ volume_group }}/appdata", label: appdata, reserve: "" }
        - { dev: "/dev/{{ volume_group }}/storage", label: storage, reserve: "-m 0" }

    - name: Mount filesystems.
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: ext4
        opts: "{{ item.opts }}"
        state: mounted
      loop:
        - { path: "{{ data_root }}", src: LABEL=data, opts: "defaults,nofail" }
        - { path: /srv/appdata, src: LABEL=appdata, opts: defaults }
        - { path: /srv/storage, src: LABEL=storage, opts: defaults }

    - name: Create data drive folder structure.
      ansible.builtin.file:
        path: "{{ data_root }}/{{ item }}"
        state: directory
        owner: andrewm
        group: andrewm
        mode: "0755"
      loop: "{{ data_dirs }}"

    # Docker setup
    - name: Download Docker's package signing key.
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker package repository.
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        signed_by: /etc/apt/keyrings/docker.asc

    - name: Install Docker.
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true

    - name: Ensure Docker service is running and enable it at boot.
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create docker group and add andrewm for docker without sudo.
      ansible.builtin.user:
        name: andrewm
        groups: docker
        append: true

    - name: Configure Docker log rotation in settings file.
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        owner: root
        group: root
        mode: "0644"
        validate: dockerd --validate --config-file=%s
      notify: Restart_docker

    # Docker Compose
    ## Jellyfin
    - name: Create Jellyfin compose, config, and cache folders.
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: andrewm
        group: andrewm
        mode: "0755"
      loop:
        - /srv/appdata/jellyfin
        - /srv/appdata/jellyfin/config
        - /srv/appdata/jellyfin/cache

    - name: Create Jellyfin compose file.
      ansible.builtin.template:
        src: jellyfin/compose.yml.j2
        dest: /srv/appdata/jellyfin/compose.yml
        owner: andrewm
        group: andrewm
        mode: "0644"

    - name: Start Jellyfin.
      community.docker.docker_compose_v2:
        project_src: /srv/appdata/jellyfin
        state: present

    ## Kiwix
    - name: Create Kiwix compose and data folders.
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: andrewm
        group: andrewm
        mode: "0755"
      loop:
        - /srv/appdata/kiwix
        - /srv/storage/kiwix

    - name: Create Kiwix compose file.
      ansible.builtin.template:
        src: kiwix/compose.yml.j2
        dest: /srv/appdata/kiwix/compose.yml
        owner: andrewm
        group: andrewm
        mode: "0644"

    - name: Start Kiwix.
      community.docker.docker_compose_v2:
        project_src: /srv/appdata/kiwix
        state: present

  # Handlers
  handlers:
    - name: Restart_docker
      ansible.builtin.service:
        name: docker
        state: restarted
