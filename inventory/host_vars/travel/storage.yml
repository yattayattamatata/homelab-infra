# Volume group, sizes, disk serial, data_root, data_dirs
---
# Device storage config
volume_group: travel-vg
appdata_size: 100g
storage_size: 1.5t
media_disk: VK25N28050903576
media_path: "/dev/disk/by-id/nvme-SPCC_M.2_PCIe_SSD_{{ media_disk }}"
media_part: "{{ media_path }}-part1"
# Data drive config
data_root: /mnt/data
data_dirs:
  - media
  - downloads/torrents/complete
  - downloads/torrents/incomplete
  - downloads/usenet/complete
  - downloads/usenet/incomplete
  - downloads/usenet/nzbs
  - downloads/usenet/watch
  - downloads/openbooks/books
  - media/animated movies
  - media/anime movies
  - media/anime tv
  - media/audiobooks
  - media/holiday movies
  - media/kids shows
  - media/library
  - media/movies
  - media/music
  - media/playlists
  - media/podcasts
  - media/sports
  - media/tv
  - media/videos
  - media/yt
